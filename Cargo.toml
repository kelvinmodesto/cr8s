
[package]
name = "c8rs"
version = "0.1.0"
edition = "2024"
default-run = "server"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
clap = "4.5.48"
diesel = { version = "~2.1.1", features = ["postgres", "chrono"] }
diesel-async = { version = "~0.4.1", features = ["postgres"] }
rand = "0.9.2"
rocket = { version = "0.5.1", features = ["json"] }
rocket_db_pools = { version = "0.2.0", features = ["diesel_postgres"] }
serde = "1.0.227"
serde_json = "1.0.145"
tokio = "1.47.1"

[dev-dependencies]
reqwest = { version = "0.12.23", features = ["json", "blocking"] }
