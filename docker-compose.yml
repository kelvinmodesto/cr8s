services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "5434:5434"
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  app:
    build: .
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5434/app_db
      - ROCKET_DATABASES={postgres={url=postgres://postgres:postgres@postgres:5434/app_db}}
      - REDIS_URL=redis://redis:6379
    command: cargo watch --why -x build
    ports:
      - "3456:3456"
    volumes:
      - ./:/app/
