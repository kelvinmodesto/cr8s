services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
  redis:
    image: redis:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
  app:
    build: .
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
      - |
        ROCKET_DATABASES={
          postgres={url=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}},
          redis={url=redis://redis:${REDIS_INTERNAL_PORT:-6379}}
        }
      - REDIS_URL=redis://redis:${REDIS_INTERNAL_PORT:-6379}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_USERNAME=${SMTP_USERNAME:-lorem@ipsum.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-lroem12131_134}
    command: cargo watch -x run
    ports:
      - "${APP_PORT:-3456}:8000"
    volumes:
      - ./:/app/
